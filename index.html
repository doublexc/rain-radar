<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เรดาร์ฝนหนองแขม - วงรัศมีเตือนภัย</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');

    :root {
      --bg: #0b111e;
      --surface: #151f32;
      --surface2: #1e2c47;
      --border: #23395d;
      --accent: #00d4ff;
      --green: #22c55e;
      --yellow: #eab308;
      --orange: #f97316;
      --red: #ef4444;
      --text: #e2e8f0;
      --text-dim: #8ba0b8;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 26px; }
    .header-title { font-size: 18px; font-weight: 800; color: var(--accent); line-height: 1.2; }
    .header-sub { font-size: 11px; color: var(--text-dim); }

    .content {
      flex: 1;
      padding: 14px 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: none;
      font-family: 'Sarabun', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-gps {
      background: linear-gradient(135deg, #0284c7, #00d4ff);
      color: #04101e;
    }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      flex: 0 0 auto;
      padding: 12px 16px;
    }

    /* Legend Box */
    .legend-bar {
      display: flex;
      justify-content: space-around;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-ring {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border-width: 2px;
      border-style: solid;
    }

    /* Radar Viewport */
    .radar-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      position: relative;
    }
    .canvas-wrap {
      position: relative;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #02050b;
      border: 1px solid var(--border);
      touch-action: none;
      line-height: 0;
    }
    .canvas-wrap img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }
    .canvas-wrap canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
      z-index: 10;
    }

    .hint-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 10px;
      min-height: 18px;
    }

    /* Status & Alerts */
    .alert-box {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .alert-warn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title-wrap">
      <div class="header-icon">🌧️</div>
      <div>
        <div class="header-title">เรดาร์เตือนฝนหนองแขม</div>
        <div class="header-sub">รัศมีตรวจวัด ~120 กม. (ภาพวน 50 นาทีล่าสุด)</div>
      </div>
    </div>
    <a href="manual.html" style="
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      border: 1px solid var(--border);
      background: var(--surface2);
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    ">
      📐 โหมดคำนวณ &rarr;
    </a>
  </div>

  <div class="content">

    <div id="alertBox" class="alert-box alert-warn"></div>

    <div class="controls">
      <button class="btn btn-gps" id="gpsBtn" onclick="requestGPS()">
        <span id="gpsIcon">📍</span>
        <span id="gpsText">ดึงตำแหน่งจาก GPS</span>
      </button>
      <button class="btn btn-secondary" onclick="reloadRadar()" title="โหลดภาพใหม่">
        🔄 รีเฟรช
      </button>
    </div>

    <div class="legend-bar">
      <div class="legend-item">
        <div class="legend-ring" style="border-color: var(--red); background: rgba(239,68,68,0.2);"></div>
        <span>5 กม.</span>
      </div>
      <div class="legend-item">
        <div class="legend-ring" style="border-color: var(--orange); background: rgba(249,115,22,0.2);"></div>
        <span>10 กม.</span>
      </div>
      <div class="legend-item">
        <div class="legend-ring" style="border-color: var(--yellow); background: rgba(234,179,8,0.2);"></div>
        <span>20 กม.</span>
      </div>
    </div>

    <div class="radar-card">
      <div class="canvas-wrap" id="canvasWrap">
        <img id="radarImg" alt="เรดาร์หนองแขม">
        <canvas id="overlayCanvas"></canvas>
      </div>
      <div class="hint-text" id="statusHint">
        👆 แตะบนภาพเพื่อปักหมุดเอง หรือกดปุ่ม GPS ด้านบน
      </div>
    </div>

  </div>

  <script>
    // ============================================================
    // CONFIGURATION & RADAR CALIBRATION (960x800 TRUE RESOLUTION)
    // ============================================================
    // สถานีเรดาร์หนองแขม
    const RADAR_STATION = { lat: 13.7056, lon: 100.3547 };
    
    // จุดกึ่งกลางภาพขนาด 960x800 พิกเซล
    const RADAR_CENTER_PX = { x: 480, y: 400 }; 
    const KM_PER_PX = 120 / 365; // ~0.3288 กม./พิกเซล (ทรงกลมสมมาตรเท่ากันทั้ง X และ Y)
    const PX_PER_KM = 1 / KM_PER_PX;

    const RADAR_URL = 'https://weather.tmd.go.th/pic_bmankLoop.gif';
    const PROXY_LIST = [
      (url) => url + '?t=' + Date.now(),
      (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}&t=${Date.now()}`
    ];

    let state = {
      userPos: null,
      userLatLon: null,
      imgWidth: 960,  // ปรับความกว้างเป็น 960
      imgHeight: 800, // ปรับความสูงเป็น 800
      pxPerKm: PX_PER_KM
    };

    // --- ฟังก์ชันแปลงพิกัดกลับสู่สมมาตรทรงกลม 1:1 ---
    function latLonToPixel(lat, lon) {
      const dLatKm = (lat - RADAR_STATION.lat) * 111.32;
      const avgLatRad = ((lat + RADAR_STATION.lat) / 2) * (Math.PI / 180);
      const dLonKm = (lon - RADAR_STATION.lon) * 111.32 * Math.cos(avgLatRad);

      return {
        x: RADAR_CENTER_PX.x + (dLonKm / KM_PER_PX),
        y: RADAR_CENTER_PX.y - (dLatKm / KM_PER_PX)
      };
    }

    function pixelToLatLon(x, y) {
      const dxPx = x - RADAR_CENTER_PX.x;
      const dyPx = RADAR_CENTER_PX.y - y;

      const dLonKm = dxPx * KM_PER_PX;
      const dLatKm = dyPx * KM_PER_PX;

      const lat = RADAR_STATION.lat + (dLatKm / 111.32);
      const avgLatRad = ((lat + RADAR_STATION.lat) / 2) * (Math.PI / 180);
      const lon = RADAR_STATION.lon + (dLonKm / (111.32 * Math.cos(avgLatRad)));

      return { lat, lon };
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadRadarImage(0);
      setupCanvasEvents();
    });

    function loadRadarImage(proxyIndex) {
      if (proxyIndex >= PROXY_LIST.length) {
        showAlert('ไม่สามารถโหลดภาพเรดาร์ได้ในขณะนี้ กรุณากดปุ่มรีเฟรชอีกครั้ง');
        return;
      }

      const img = new Image();
      const targetSrc = PROXY_LIST[proxyIndex](RADAR_URL);

      img.onload = () => {
        radarImg.src = targetSrc;
        state.imgWidth = img.naturalWidth || 960;
        state.imgHeight = img.naturalHeight || 800;
        canvas.width = state.imgWidth;
        canvas.height = state.imgHeight;
        drawOverlay();
      };

      img.onerror = () => {
        loadRadarImage(proxyIndex + 1);
      };

      img.src = targetSrc;
    }

    function reloadRadar() {
      hideAlert();
      loadRadarImage(0);
    }

    function setupCanvasEvents() {
      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        hideAlert();

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        state.userPos = { x, y };
        const coords = pixelToLatLon(x, y);
        state.userLatLon = coords;

        drawOverlay();

        document.getElementById('statusHint').innerHTML = 
          `📍 ปักหมุดที่: <strong>Lat ${coords.lat.toFixed(4)}, Lon ${coords.lon.toFixed(4)}</strong> ` +
          `<span style="color: var(--text-dim); font-size: 11px;">(Pixel: X=${Math.round(x)}, Y=${Math.round(y)})</span>`;
      });
    }

    function requestGPS() {
      hideAlert();

      if (!navigator.geolocation) {
        showAlert('เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง GPS');
        return;
      }

      const btn = document.getElementById('gpsBtn');
      const icon = document.getElementById('gpsIcon');
      const text = document.getElementById('gpsText');

      btn.disabled = true;
      icon.innerHTML = '<div class="spinner"></div>';
      text.textContent = 'กำลังค้นหาตำแหน่ง...';

      navigator.geolocation.getCurrentPosition(
        (position) => {
          btn.disabled = false;
          icon.innerHTML = '📍';
          text.textContent = 'ดึงตำแหน่งจาก GPS';

          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          const pixelPos = latLonToPixel(lat, lon);

          const distFromCenterPx = Math.sqrt(
            Math.pow(pixelPos.x - RADAR_CENTER_PX.x, 2) + 
            Math.pow(pixelPos.y - RADAR_CENTER_PX.y, 2)
          );

          // ตรวจสอบระยะหลุด 120 กม. (ใช้ KM_PER_PX_AVG แทนตัวแปรเดิมที่หายไป)
          if (distFromCenterPx > (120 / KM_PER_PX_AVG)) {
            showAlert('ตำแหน่งของคุณอยู่นอกขอบเขตตรวจวัดของเรดาร์ (เกิน 120 กม.)');
            return;
          }

          state.userPos = pixelPos;
          state.userLatLon = { lat, lon };
          drawOverlay();

          document.getElementById('statusHint').innerHTML = 
            `📍 ล็อกพิกัด GPS แล้ว: <strong>Lat ${lat.toFixed(4)}, Lon ${lon.toFixed(4)}</strong> ` +
            `<span style="color: var(--text-dim); font-size: 11px;">(Pixel: X=${Math.round(pixelPos.x)}, Y=${Math.round(pixelPos.y)})</span>`;
        },
        (error) => {
          btn.disabled = false;
          icon.innerHTML = '📍';
          text.textContent = 'ดึงตำแหน่งจาก GPS';

          let msg = 'ไม่สามารถดึงตำแหน่ง GPS ได้';
          if (error.code === error.PERMISSION_DENIED) {
            msg = 'เบราว์เซอร์ถูกบล็อกสิทธิ์ตำแหน่ง (ต้องเปิดผ่าน HTTPS หรือ GitHub Pages เท่านั้น)';
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            msg = 'ไม่พบสัญญาณ GPS กรุณาแตะปักหมุดเองบนภาพ';
          }
          showAlert(msg);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function drawOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!state.userPos) return;

      const { x, y } = state.userPos;
      const pxPerKm = state.pxPerKm;

      const rings = [
        { km: 20, color: '#eab308', fill: 'rgba(234, 179, 8, 0.08)', label: '20 กม.' },
        { km: 10, color: '#f97316', fill: 'rgba(249, 115, 22, 0.12)', label: '10 กม.' },
        { km: 5,  color: '#ef4444', fill: 'rgba(239, 68, 68, 0.18)', label: '5 กม.' }
      ];

      rings.forEach(ring => {
        const radius = ring.km * pxPerKm;

        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = ring.fill;
        ctx.fill();
        ctx.strokeStyle = ring.color;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = 'bold 11px Sarabun';
        ctx.fillStyle = ring.color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(ring.label, x, y - radius - 3);
      });

      // หมุดกึ่งกลาง
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 212, 255, 0.4)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#00d4ff';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function showAlert(msg) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideAlert() {
      const box = document.getElementById('alertBox');
      box.style.display = 'none';
    }
  </script>
</body>
</html>
